[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdl-camera-server"
version = "0.1.0"
description = "Independent USB and RealSense camera service with a Python client"
requires-python = ">=3.10,<3.14"
license = "MIT"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "PyYAML>=6", "filelock>=3.16"]

[project.optional-dependencies]
usb = ["opencv-python-headless>=4.10,<5", "cv2-enumerate-cameras>=1.3"]
realsense = ["pyrealsense2>=2.55", "numpy>=1.26", "Pillow>=10"]
test = ["pytest>=8", "numpy>=1.26", "Pillow>=10"]

[project.scripts]
sdl-camera-server = "sdl_camera_server.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
